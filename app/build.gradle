apply plugin: 'idea'
apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

dependencies {
	implementation project(':library')
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'androidx.browser:browser:1.9.0'
	implementation 'androidx.cardview:cardview:1.0.0'
	implementation 'androidx.palette:palette:1.0.0'
	implementation 'androidx.recyclerview:recyclerview:1.4.0'
	implementation 'androidx.multidex:multidex:2.0.1'

	implementation 'com.adevinta.android:leku:11.1.4'

	implementation 'com.google.android.gms:play-services-maps:19.2.0'
	implementation 'com.google.android.gms:play-services-auth:21.4.0'
	implementation 'com.google.android.libraries.places:places:3.5.0'
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'com.google.code.gson:gson:2.13.1'
	implementation 'com.google.firebase:firebase-analytics:23.0.0'
	implementation 'com.google.guava:guava:33.4.8-android'

	implementation 'com.squareup.picasso:picasso:2.71828'
	implementation 'com.squareup.okhttp3:okhttp:5.1.0'
	implementation('com.squareup.okhttp3:logging-interceptor:5.1.0')

	implementation 'fr.avianey.com.viewpagerindicator:library:2.4.1.1@aar'
	testImplementation 'junit:junit:4.13.2'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
	namespace 'uk.ac.horizon.artcodes'
	compileSdkVersion 36

	buildFeatures {
		dataBinding true
		buildConfig true
		resValues true
	}

	signingConfigs {
		release {
			storeFile file(keystoreProperties['keystore'])
			storePassword keystoreProperties['keystore.password']
			keyAlias keystoreProperties['key.alias']
			keyPassword keystoreProperties['key.password']
		}
	}

	buildTypes {
		release {
			signingConfig signingConfigs.release
		}
		debug {
			signingConfig signingConfigs.release
		}
	}

	defaultConfig {
		applicationId "uk.ac.horizon.aestheticodes"
		versionName '3.5.0'
		versionCode 4000861
		minSdkVersion 21
		targetSdkVersion 36
		signingConfig signingConfigs.release
		multiDexEnabled false
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_18
		targetCompatibility JavaVersion.VERSION_18
	}

	lint {
		abortOnError false
	}
}
